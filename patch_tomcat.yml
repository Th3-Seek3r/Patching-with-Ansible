---
- name: Upgrade Apache Tomcat to 11.0.18
  hosts: localhost
  become: yes

  vars:
    tomcat_install_dir: /opt/tomcat
    tomcat_version: 11.0.18
    tomcat_archive: "apache-tomcat-{{ tomcat_version }}.tar.gz"
    tomcat_url: "https://archive.apache.org/dist/tomcat/tomcat-11/v{{ tomcat_version }}/bin/{{ tomcat_archive }}"

  tasks:

    ####################################################
    # 1. Ensure Java 17 is installed (Required for Tomcat 11)
    ####################################################
    - name: Install compatible Java (Kali-safe)
      apt:
        name: default-jdk
        state: present
        update_cache: yes

    ####################################################
    # 2. Stop existing Tomcat if running
    ####################################################
    - name: Stop existing Tomcat
      shell: "{{ tomcat_install_dir }}/bin/shutdown.sh"
      ignore_errors: yes

    ####################################################
    # 3. Remove vulnerable Tomcat installation
    ####################################################
    - name: Remove old Tomcat directory
      file:
        path: "{{ tomcat_install_dir }}"
        state: absent

    ####################################################
    # 4. Download Tomcat 11.0.18
    ####################################################
    - name: Download Tomcat archive
      get_url:
        url: "{{ tomcat_url }}"
        dest: "/opt/{{ tomcat_archive }}"
        timeout: 300
        mode: '0644'

    ####################################################
    # 5. Extract Tomcat archive
    ####################################################
    - name: Extract Tomcat archive
      unarchive:
        src: "/opt/{{ tomcat_archive }}"
        dest: /opt
        remote_src: yes

    ####################################################
    # 6. Rename extracted directory
    ####################################################
    - name: Rename extracted directory to /opt/tomcat
      command: mv "/opt/apache-tomcat-{{ tomcat_version }}" "{{ tomcat_install_dir }}"
      args:
        creates: "{{ tomcat_install_dir }}"

    ####################################################
    # 7. Set ownership and permissions
    ####################################################
    - name: Set ownership and permissions
      file:
        path: "{{ tomcat_install_dir }}"
        owner: root
        group: root
        mode: '0755'
        recurse: yes

    ####################################################
    # 8. Start Tomcat 11
    ####################################################
    - name: Start Tomcat
      shell: "{{ tomcat_install_dir }}/bin/startup.sh"

    ####################################################
    # 9. Verify Tomcat is running
    ####################################################
    - name: Check Tomcat service
      uri:
        url: http://localhost:8080
        status_code: 200
      register: tomcat_check
      retries: 5
      delay: 5
      until: tomcat_check.status == 200

    ####################################################
    # 10. Cleanup downloaded archive
    ####################################################
    - name: Remove downloaded archive
      file:
        path: "/opt/{{ tomcat_archive }}"
        state: absent